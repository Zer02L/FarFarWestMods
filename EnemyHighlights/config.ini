; ==============================================================================
; EnemyHighlights Mod Configuration
; Warframe-style Fresnel Rim Glow on Enemies (Client-Side, Depth-Tested)
; ==============================================================================

[General]
; Master toggle for enemy highlights (1 = Enabled, 0 = Disabled)
Enabled = 1

; Global brightness and emissive glow multiplier (e.g. 1.0 to 10.0)
; Warframe-like vibrant glow is typically around 2.5 - 4.0
IntensityMultiplier = 3.0

; Fresnel rim power / sharpness (higher = thinner outer edge glow, lower = broader glow)
; Recommended values: 1.5 - 4.0 (Default: 2.5)
FresnelExponent = 2.5

; Inner body opacity / tint (0.0 = completely transparent inside, pure rim glow; 0.2 = subtle body fill)
InnerAlpha = 0.05

; Maximum distance to highlight enemies (in Unreal Units / cm; 10000 = 100m, 0 = unlimited)
MaxDistance = 15000.0

; ==============================================================================
; Highlight Colors (RGB values from 0.0 to 1.0)
; ==============================================================================

[Colors]
; Standard enemy rim color (Default: Warframe Energy Orange / Amber)
; Color: Bright Orange (#FF6600)
EnemyColorR = 1.0
EnemyColorG = 0.4
EnemyColorB = 0.0
EnemyColorA = 1.0

; Elite enemy rim color (Default: Vibrant Violet / Purple #B800FF)
EliteColorR = 0.72
EliteColorG = 0.0
EliteColorB = 1.0
EliteColorA = 1.0

; Boss enemy rim color (Default: Blazing Crimson / Red #FF1030)
BossColorR = 1.0
BossColorG = 0.06
BossColorB = 0.18
BossColorA = 1.0

; ==============================================================================
; Aimed-Part & Target Acquisition Overlay
; When your crosshair aims at an enemy or specific limb/weakpoint,
; the highlight shifts to this color for high-visibility target feedback.
; Also recolors any existing in-game aimed weakspot overlays.
; ==============================================================================

[AimedOverlay]
; Enable recoloring when aiming at enemies / weakpoints (1 = Yes, 0 = No)
RecolorAimedPart = 1

; Aimed target color (Default: Electric Cyan / Turquoise #00E5FF)
AimedColorR = 0.0
AimedColorG = 0.9
AimedColorB = 1.0
AimedColorA = 1.0

; Aimed intensity multiplier (boosts brightness on target acquisition)
AimedIntensity = 5.0

; Highlight only the specific aimed limb / mesh component (1), or the entire aimed enemy (0)
AimedPartOnly = 0

; Maximum aim trace distance (in Unreal Units / cm)
MaxAimDistance = 20000.0

; ==============================================================================
; Keybindings
; (Available keys: F1-F12, NUM_ZERO-NUM_NINE, etc.)
; ==============================================================================

[Keybinds]
; Toggle highlights on/off at runtime
ToggleKey = F8

; Reload configuration from config.ini without restarting the game
ReloadConfigKey = F7
